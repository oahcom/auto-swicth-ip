[Service]
# 部署前关卡：未定义名字静态检查。
#
# WHY 需要这一道（2026-11-11 实测事故）：
#   daemon 是被 systemd `Restart=always` + `RestartSec=10` 托管的。任何
#   **启动期**异常都会变成「启动 → 崩溃 → 重启 → 崩溃」的循环 —— 实测
#   17:22:31 起，自检函数里一个未定义名字 `PROJECT` 抛 NameError，
#   restart counter 打到 23，服务瘫了 5 分钟（17:27 才恢复）。
#
# WHY 用 drop-in 而不是改单元本体：
#   本机的 auto-switch-ip.service 不是 deploy/install.sh 生成的（那版带
#   KillMode=process），是手工维护的旧版 —— 改单元本体会在
#   `install.sh --units-only` 重生成时被覆盖。drop-in 目录已有先例
#   （align-sub / killmode / user 三个），互不覆盖。
#
# WHY 这一道能覆盖所有路径：systemd 每次拉起进程**之前**都会跑
# ExecStartPre。无论是 `systemctl restart`（手工，最常见的部署方式）、
# `install.sh`、`remote-deploy.sh`、还是 OOM 后的自动拉起，都要过这一关。
# 检测到未定义名字就让进程起不来 —— 一次失败，而不是 23 次。
#
# ── WHY 用相对路径而不是绝对路径 ──────────────────────────────────────
# 实测（2026-11-11 17:51）：用绝对路径写 ExecStartPre 时，systemd 每次
# 都报
#   python3: can't open file '/home/administrator/.../tools/check_undefined_names.py':
#   [Errno 2] No such file or directory
# 而同一时刻，shell 里 `ls` 得到、python3 直接跑也得到、`systemd-run`
# 带 `WorkingDirectory=` 也跑得通。
#
# 根因是 **WSL 的 systemd 实例与交互式 shell 的挂载命名空间不同**：
# systemd 上下文里 `/home/administrator/...` 这一段解析不到，而单元自己
# 的 `WorkingDirectory=` 是可用的（单元本体早已用它跑 daemon.py 本身，
# 一直没问题）。所以这里用相对路径 `tools/...` + 单元已有的
# `WorkingDirectory`，避开跨命名空间的绝对路径。
#
# 实测验证：`systemd-run -p WorkingDirectory=<项目根> python3 tools/... daemon.py`
# 成功；绝对路径版本失败。
# 覆盖所有核心模块，不只是 daemon.py：2026-11-11 审查发现只查主文件时，
# dormant_probe.py / config.py / warp_blocks.py 里的未定义名照样能让服务
# 在启动期崩掉（这些都是 daemon 直接或间接 import 的模块）。
ExecStartPre=/usr/bin/python3 tools/check_undefined_names.py daemon.py dormant_probe.py config.py warp_wg.py warp_blocks.py parse_subscription.py
