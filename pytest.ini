[pytest]
asyncio_mode = auto
# 只收集 test_*.py。debug_test.py 是手工调试脚本，模块级调用
# logging.disable(CRITICAL)，被 pytest 当作 *_test.py 收集时会让整个
# 测试进程的日志静默（test_subscription_parse 的日志断言因此全空）。
python_files = test_*.py
# 可信子集运行通道的分组标记：由 conftest.py 按文件名前缀自动打点，
# tests/run_groups.py 按组以独立进程运行（进程级隔离，切断全量互踩）。
# 不改用例文件；`python3 -m pytest -m warp` 也可单独选组。
markers =
    warp: 分组 test_warp_*（WARP 隧道族）
    slot: 分组 test_slot_*（槽位族）
    rotate: 分组 test_rotate_*（/rotate 与换线族）
    gate: 分组 test_gate_*（闸口族）
    config: 分组 test_config_*（配置族）
    daemon: 分组 test_daemon_*（daemon 结构族）
    asip: 分组 test_asip_*（asip 工具/API/集成族）
    dormant: 分组 test_dormant_*（dormant 探测族）
    tier: 分组 test_tier_*（档位族）
    h2: 分组 test_h2_*（h2 线族）
    egress: 分组 test_egress_*（出口冷却族）
    probe: 分组 test_probe_*（探针族）
    channel: 分组 test_channel_*（渠道族）
    api: 分组 test_api_*（api 统计族）
    audit: 分组 test_audit_*（审计族）
    state: 分组 test_state_*（状态文件族）
    ledger: 分组 test_ledger_*（台账族）
    self: 分组 test_self_*（自演进族）
    node: 分组 test_node_*（节点族）
    subscription: 分组 test_subscription_*（订阅族）
    reconcile: 分组 test_reconcile_*（对账族）
    rebind: 分组 test_rebind_*（重绑定族）
    demoted: 分组 test_demoted_*（降级族）
    trace: 分组 test_trace_*（链路追踪族）
    portability: 分组 test_portability（可移植性族）
    vercel: 分组 test_vercel_*（vercel 中继族）
    night: 分组 test_night_*（夜间窗族）
    opencode: 分组 test_opencode_*（opencode 闸口族）
    proxy: 分组 test_proxy_*（代理池族）
    auto: 分组 test_auto_*（auto_switch 族）
    block: 分组 test_block_*（warp_blocks 族）
    cooldown: 分组 test_429_*（429 冷却族）
    verify: 分组 test_verify_*（验证族）
    tools: 分组 test_tools_*（工具族）
    alerting: 分组 test_alerting_*（告警/健康行为族，tests/test_alerting_4a.py）
    contracts: 分组 tests/contracts/ 整树（P2 契约测试三分法）
    misc: 其余未归组文件（tests/run_groups.py 兜底组）
